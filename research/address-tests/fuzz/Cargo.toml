[package]
name = "address-tests-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Detached workspace: the repository root manifest is immutable.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
address-tests = { path = ".." }
bombay-address = { path = "../../../crates/address" }

